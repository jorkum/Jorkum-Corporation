
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JORKUM CORPORATION</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #05080e;
}

.portada {
  width: 100%;
  height: 100vh;
  background-image: url('portada.jpg');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  position: relative;
}

.entrar {
  position: absolute;
  left: 67%;
  top: 70%;
  transform: translate(-50%, -50%);
  width: 27%;
  height: 13%;
  background: transparent;
  border: none;
  cursor: pointer;
}

.entrar:hover {
  background: rgba(255, 196, 70, 0.10);
  box-shadow: 0 0 35px rgba(255, 190, 50, 0.35);
  border-radius: 15px;
}

@media(max-width: 700px) {
  .portada {
    background-size: auto 100%;
    background-position: center;
  }

  .entrar {
    left: 50%;
    top: 75%;
    width: 70%;
    height: 12%;
  }
}
</style>
</head>

<body>

<div class="portada">
  <button class="entrar"
    aria-label="Entrar en Jorkum Corporation"
    onclick="window.location.href='principal.html'">
  </button>
</div>

</body>
</html>
